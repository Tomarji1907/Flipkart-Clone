<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>More - Flipkart</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #2874f0,
                    #0d47a1
                );

            padding: 30px;

        }

        .more-box {

            width: 90%;

            max-width: 600px;

            margin: 50px auto;

            padding: 35px;

            background: #ffffff;

            border-radius: 12px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.25);

        }

        .more-box h1 {

            color: #2874f0;

            margin-bottom: 25px;

            text-align: center;

        }

        .option {

            display: block;

            padding: 15px;

            margin-bottom: 10px;

            background: #f5f5f5;

            border-radius: 7px;

            color: #222;

            text-decoration: none;

            font-weight: bold;

        }

        .option:hover {

            background: #2874f0;

            color: #ffffff;

        }

        .home-link {

            display: block;

            margin-top: 25px;

            text-align: center;

            color: #2874f0;

            text-decoration: none;

            font-weight: bold;

        }

    </style>

</head>


<body>

    <div class="more-box">

        <h1>
            More Options
        </h1>


        <a
            href="login.html"
            class="option">

            👤 My Account

        </a>


        <a
            href="cart.html"
            class="option">

            🛒 My Cart

        </a>


        <a
            href="#"
            class="option">

            📦 My Orders

        </a>


        <a
            href="#"
            class="option">

            ❤️ Wishlist

        </a>


        <a
            href="#"
            class="option">

            ⚙️ Settings

        </a>


        <a
            href="../index.html"
            class="home-link">

            ← Back to Home

        </a>

    </div>

</body>

</html>
