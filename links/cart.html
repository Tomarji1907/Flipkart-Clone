<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cart - Flipkart</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #2874f0,
                    #0d47a1
                );

        }

        .cart-box {

            width: 90%;

            max-width: 500px;

            padding: 40px;

            background: #ffffff;

            border-radius: 12px;

            text-align: center;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.25);

        }

        .cart-icon {

            font-size: 55px;

            margin-bottom: 15px;

        }

        .cart-box h1 {

            color: #2874f0;

            margin-bottom: 12px;

        }

        .cart-box p {

            color: #555;

            margin-bottom: 25px;

        }

        .home-link {

            display: inline-block;

            padding:
                12px 22px;

            background: #2874f0;

            color: #ffffff;

            border-radius: 6px;

            text-decoration: none;

            font-weight: bold;

        }

    </style>

</head>


<body>

    <div class="cart-box">

        <div class="cart-icon">
            🛒
        </div>

        <h1>
            Your Cart
        </h1>

        <p>
            Your shopping cart is currently empty.
        </p>


        <a
            href="../index.html"
            class="home-link">

            ← Continue Shopping

        </a>

    </div>

</body>

</html>
