<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - Flipkart</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #d6d1cf,
                    #ffffff
                );

        }

        .login-box {

            width: 90%;

            max-width: 400px;

            padding: 35px;

            background: #ffffff;

            border-radius: 12px;

            text-align: center;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.25);

        }

        .login-box h1 {

            margin-bottom: 10px;

            color: #2874f0;

        }

        .login-box p {

            margin-bottom: 25px;

            color: #555;

        }

        .login-box input {

            width: 100%;

            padding: 13px;

            margin-bottom: 14px;

            border:
                1px solid #ccc;

            border-radius: 6px;

            outline: none;

            font-size: 15px;

        }

        .login-box button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 6px;

            background: #2874f0;

            color: #ffffff;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

        }

        .home-link {

            display: inline-block;

            margin-top: 20px;

            color: #2874f0;

            text-decoration: none;

            font-weight: bold;

        }

    </style>

</head>


<body>

    <div class="login-box">

        <h1>Login</h1>

        <p>Welcome to Flipkart</p>


        <input
            type="text"
            placeholder="Enter Mobile Number">


        <input
            type="password"
            placeholder="Enter Password">


        <button type="button">
            Login
        </button>


        <a
            href="../index.html"
            class="home-link">

            ← Back to Home

        </a>

    </div>

</body>

</html>
